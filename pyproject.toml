[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thought-archaeology"
version = "0.1.0"
description = "Inspectable AI thought-graphs: inhabit, fork, and keep the negative space."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MelaBuilt AI" }]
dependencies = [
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ta = "thought_archaeology.cli:main"
ta-harness-grok = "thought_archaeology.adapters.grok:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thought_archaeology = [
  "py.typed",
  "schemas/v1/*.json",
  "prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

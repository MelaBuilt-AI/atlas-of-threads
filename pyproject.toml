[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thought-archaeology"
version = "0.1.0"
description = "Inspectable AI thought-graphs: inhabit, fork, and keep the negative space."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MelaBuilt AI" }]
dependencies = [
  "jsonschema>=4.22",
]

[project.urls]
Homepage = "https://atlasofthreads.com"
Repository = "https://github.com/MelaBuilt-AI/atlas-of-threads"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ta = "thought_archaeology.cli:main"
ta-harness-claude = "thought_archaeology.adapters.claude:main"
ta-harness-codex = "thought_archaeology.adapters.codex:main"
ta-harness-grok = "thought_archaeology.adapters.grok:main"
ta-harness-opencode = "thought_archaeology.adapters.opencode:main"
ta-harness-prime-agent = "thought_archaeology.adapters.prime_agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thought_archaeology = [
  "py.typed",
  "schemas/v1/*.json",
  "prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

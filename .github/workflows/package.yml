name: package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/package.yml"
      - "packaging/**"
      - "pyproject.toml"
      - "src/**"
      - "viz/dist/**"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build standalone application
        run: |
          python -m pip install -e ".[packaging]"
          python -m PyInstaller --clean --noconfirm packaging/atlas.spec
          mv dist/atlas-of-threads dist/atlas-of-threads-linux-x86_64
          cd dist
          sha256sum atlas-of-threads-linux-x86_64 > atlas-of-threads-linux-x86_64.sha256
      - name: Smoke test packaged CLI
        run: |
          dist/atlas-of-threads-linux-x86_64 --help
          TA_WORKER_BACKEND=application dist/atlas-of-threads-linux-x86_64 \
            --store "$RUNNER_TEMP/atlas-smoke" launch --no-browser --port 7468 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:7468/api/sessions && break
            sleep 0.2
          done
      - uses: actions/upload-artifact@v6
        with:
          name: atlas-of-threads-linux-x86_64
          path: |
            dist/atlas-of-threads-linux-x86_64
            dist/atlas-of-threads-linux-x86_64.sha256
            packaging/linux/install.sh
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build standalone application
        shell: pwsh
        run: |
          python -m pip install -e ".[dev,packaging]"
          pytest -q tests/test_launcher.py tests/test_store.py
          python -m PyInstaller --clean --noconfirm packaging/atlas.spec
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $store = Join-Path $env:RUNNER_TEMP "atlas-smoke"
          $app = Start-Process dist\AtlasOfThreads.exe -ArgumentList @("--store", $store, "launch", "--no-browser", "--port", "7468") -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-RestMethod http://127.0.0.1:7468/api/sessions
                if ($null -ne $response.sessions) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if (-not $ready) { throw "Packaged Atlas did not start" }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\atlas-of-threads.iss
      - uses: actions/upload-artifact@v6
        with:
          name: atlas-of-threads-windows-x86_64
          path: dist/windows-installer/AtlasOfThreadsSetup.exe
          if-no-files-found: error

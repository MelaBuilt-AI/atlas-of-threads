<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inhabit Space — Thought Archaeology</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="banner">story graph · not a circuit trace</div>
  <div id="help">← → preview a path · enter walk it · ↑ deeper · ↓ / b back · c overhead · shift+c home · f cut · v human no · h help</div>
  <div id="plate">
    <div class="kind" id="kind"></div>
    <h1 id="text"></h1>
    <div class="here" id="here"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div id="composer" hidden>
    <div class="kind" id="composer-label">fork</div>
    <input id="composer-input" type="text" maxlength="400" autocomplete="off" spellcheck="false" />
    <div class="hint">enter commits · esc cancels</div>
  </div>
  <div id="empty">
    <div>
      <p>No thought-graph in this store.</p>
      <p class="meta">Run <code>ta init</code> and compile a fixture, then refresh.</p>
    </div>
  </div>
  <script src="./three.min.js"></script>
  <script src="./space.js"></script>
</body>
</html>
